spring.application.name=tagua
server.port=${PORT:8080}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never 

# Lê variáveis locais do arquivo .env (que NÃO vai pro GitHub)
spring.config.import=optional:file:.env[.properties]

# Banco de dados (local ou nuvem, conforme o DB_URL).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/duvidasdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Chaves de acesso (ficam no .env ou no painel do servidor, NUNCA aqui)
app.chave.aluno=${API_KEY_ALUNO}
app.chave.professor=${API_KEY_PROFESSOR}

# CORS: origens que podem chamar a API pelo navegador (separadas por vírgula)
app.cors.origens=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080


